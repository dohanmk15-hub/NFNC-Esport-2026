<style>

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:#fff;font:16px/1.5 'Rajdhani',sans-serif;letter-spacing:1.5px;min-height:100vh;overflow-x:hidden;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:50px 50px;background-attachment:fixed}

h1,h2,h3,h4{font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:2px;word-break:break-word}
a{color:inherit;text-decoration:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{text-shadow:0 0 6px rgba(255,255,255,.4)}50%{text-shadow:0 0 14px #fff,0 0 30px rgba(255,255,255,.6)}}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:14px;padding:10px 4%;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(5,5,5,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:var(--bd)}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.5rem;text-shadow:var(--glow)}
nav{flex:1;min-width:0}
nav ul{display:flex;gap:16px;list-style:none;justify-content:center;flex-wrap:wrap}
nav a{display:block;color:var(--sec);text-transform:uppercase;font-size:.8rem;font-weight:700;padding:8px 2px;border-bottom:2px solid transparent;transition:.3s}
nav a:hover,nav a.active{color:#fff;border-bottom-color:#fff}
nav a.adm{color:var(--adm)}nav a.adm.active{border-bottom-color:var(--adm)}
.auth{display:flex;align-items:center;gap:8px;flex-shrink:0}
.who{font-weight:700;font-size:.85rem;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.burger{display:none;background:none;border:var(--bd);color:#fff;font-size:1.4rem;width:44px;height:44px;cursor:pointer}
main{max-width:1250px;margin:0 auto;padding:110px 5% 50px;min-height:80vh;animation:fadeIn .6s}
footer{text-align:center;padding:36px 5%;border-top:1px solid rgba(160,160,160,.2);color:var(--sec);font-size:.85rem;text-transform:uppercase}
footer small{display:block;font-size:.7rem;margin-top:4px}
/* basics */
.title{text-align:center;font-size:2.2rem;text-shadow:var(--glow)}
.sub{text-align:center;color:var(--sec);text-transform:uppercase;letter-spacing:4px;margin:6px 0 34px}
.sec{text-align:center;margin:44px 0 20px;font-size:1.2rem}
.sec2{margin:26px 0 12px;font-size:1rem}
.muted{color:var(--sec)}.center{text-align:center}.err{color:var(--danger);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:var(--bd);padding:22px;transition:.3s;min-width:0}
.card:hover{border-color:#fff;box-shadow:var(--glow);transform:translateY(-5px)}
.card h3{font-size:1rem;margin:8px 0 4px}
.ico{font-size:2.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 22px;background:transparent;border:2px solid #fff;color:#fff;font:700 .8rem 'Orbitron',sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.3s;text-align:center}
.btn:hover{background:#fff;color:#000;box-shadow:var(--glow)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.7rem;border-width:1px}
.btn.ghost{border-color:rgba(255,255,255,.4)}
.btn.danger{border-color:var(--danger);color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff;box-shadow:none}
.btn.okb{border-color:var(--ok);color:var(--ok)}.btn.okb:hover{background:var(--ok);color:#000;box-shadow:none}
.btn.full{width:100%;margin-top:6px}
.btn.off{opacity:.4;pointer-events:none;border-color:#555}
.btn.shopee{border-color:#ee4d2d;color:#ee4d2d}.btn.shopee:hover{background:#ee4d2d;color:#fff;box-shadow:none}
.btn.toped{border-color:#42b549;color:#42b549}.btn.toped:hover{background:#42b549;color:#fff;box-shadow:none}
.badge{display:inline-block;padding:2px 10px;border:1px solid var(--sec);font-size:.7rem;font-weight:700;text-transform:uppercase;border-radius:3px;white-space:nowrap}
.badge.adm{color:var(--adm);border-color:var(--adm)}.badge.mem{color:var(--acc);border-color:var(--acc)}
.badge.gold,.badge.r1{color:var(--gold);border-color:var(--gold)}.badge.r2{color:var(--silver);border-color:var(--silver)}.badge.r3{color:var(--bronze);border-color:var(--bronze)}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.off{color:var(--danger);border-color:var(--danger)}.badge.warn{color:var(--gold);border-color:var(--gold)}
/* home */
.hero{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.hero-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(3rem,13vw,7rem);letter-spacing:.12em;text-shadow:var(--glow);animation:pulseGlow 3s infinite}
.est{font-family:'Orbitron',sans-serif;color:var(--gold);letter-spacing:6px;text-shadow:0 0 10px rgba(255,215,0,.5)}
.tag{font-size:clamp(.9rem,3.5vw,1.2rem);letter-spacing:5px;text-transform:uppercase;color:var(--sec)}
.about{max-width:620px;color:#ddd}
.notice{border:1px dashed var(--gold);color:var(--gold);padding:10px 16px;max-width:640px}
.cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;margin-top:34px}
.stat{text-align:center;padding:20px}.stat b{display:block;font:900 2.1rem 'Orbitron',sans-serif}.stat span{color:var(--sec);text-transform:uppercase;font-size:.8rem}
.stats.gold .stat{border-color:rgba(255,215,0,.3)}.stats.gold b{color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,.6)}

.tl .card{position:relative;margin-bottom:18px}

.av.xl{width:120px;height:120px;font-size:3.4rem;margin:0;box-shadow:var(--glow)}
.mc{text-align:center;cursor:pointer}
.tid{font:700 .8rem 'Orbitron',sans-serif;color:var(--acc)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.bar input,.bar select{flex:1;min-width:150px;margin:0}
/* forms */

input:focus,select:focus,textarea:focus{outline:none;border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
select option{background:#111}textarea{min-height:100px;resize:vertical}
input[type=file]{padding:8px;margin-bottom:0}
.fl{display:block;color:var(--sec);text-transform:uppercase;font-size:.8rem;margin-bottom:5px}
.fbox{max-width:600px;margin:26px auto 0;background:var(--card);border:var(--bd);padding:30px}
.fbox h3{margin-bottom:14px}
.up{margin-bottom:12px;display:flex;flex-direction:column;gap:8px}.up.busy{opacity:.5}
.prev img,.prev video{max-height:140px;border:var(--bd)}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:var(--bd)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;border-bottom:1px dashed rgba(255,255,255,.15);text-align:left;font-size:.9rem;vertical-align:middle}
th{color:var(--sec);text-transform:uppercase;font-size:.72rem;white-space:nowrap}
td .btn{margin:2px 3px 2px 0}
.th{width:44px;height:44px;object-fit:cover;border-radius:50%}
.acts{white-space:nowrap}
/* admin */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;-webkit-overflow-scrolling:touch}
.tab{flex-shrink:0;min-height:44px;padding:8px 16px;background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--sec);font:700 .85rem 'Rajdhani',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.3s}
.tab:hover{color:#fff;border-color:#fff}.tab.on{color:#fff;border-color:var(--adm);box-shadow:0 0 12px rgba(255,0,255,.5)}
.list{list-style:none}.list li{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.15)}
.plus{color:var(--ok)}.minus{color:var(--danger)}
/* profile */
.prof{max-width:900px;margin:0 auto;background:var(--card);border:2px solid var(--acc);box-shadow:0 0 18px rgba(0,229,255,.25);padding:26px}
.prof.is-admin{border-color:var(--adm);box-shadow:0 0 22px rgba(255,0,255,.4);background:linear-gradient(160deg,#1a0a1a,#111 60%)}
.ph{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:1.6rem;margin:4px 0}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:22px}
.info div{border:var(--bd);padding:12px;text-align:center}.info b{display:block;font:700 1.2rem 'Orbitron',sans-serif;word-break:break-word}.info span{color:var(--sec);font-size:.75rem}
.rights{margin-top:22px;border:1px dashed var(--adm);padding:14px}.rights h3{font-size:.9rem;color:var(--adm);margin-bottom:8px}.rights ul{list-style:none}
/* docs + apparel */
.docs{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.doc img,.doc video{width:100%;aspect-ratio:16/10;object-fit:cover;background:#000;cursor:zoom-in}.doc video{cursor:default}
.pimg{aspect-ratio:1;background:linear-gradient(135deg,#1a1a1a,#0a0a0a);border:1px dashed #444;display:flex;align-items:center;justify-content:center;color:var(--sec);overflow:hidden;margin-bottom:10px}
.pimg img{width:100%;height:100%;object-fit:cover}
.price{color:var(--gold);font-weight:700;font-size:1.1rem}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
/* modal + toast */
.mbg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.82);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.mbg.open{display:flex}
.mbox{width:100%;max-width:560px;background:#0a0a0a;border:2px solid #fff;box-shadow:var(--glow);padding:22px;margin:auto 0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.mhead h3{font-size:1.05rem}
.x{background:none;border:var(--bd);color:#fff;width:40px;height:40px;cursor:pointer;font-size:1rem;flex-shrink:0}
.zoom{max-height:75vh;margin:0 auto;object-fit:contain}
.cred{border:1px dashed var(--ok);padding:12px;margin:10px 0;word-break:break-all;font-family:monospace}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);z-index:400;max-width:92%;background:#0a0a0a;border:2px solid var(--ok);color:var(--ok);padding:12px 22px;font-weight:700;opacity:0;pointer-events:none;transition:.35s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:var(--danger);color:var(--danger)}
/* responsive */
@media(max-width:1020px){
.burger{display:block}
.auth{order:2;margin-left:auto}.logo{order:0}.burger{order:3}
nav{position:fixed;top:0;left:0;right:0;transform:translateY(-120%);transition:transform .3s;background:#050505;padding:78px 6% 20px;border-bottom:var(--bd);z-index:-1;max-height:100vh;overflow-y:auto}
nav.open{transform:none}
nav ul{flex-direction:column;gap:0;align-items:stretch}
nav a{padding:14px 4px;font-size:.95rem;border-bottom:1px solid rgba(255,255,255,.1)}
}
@media(max-width:600px){
main{padding:96px 4% 40px}
.title{font-size:1.5rem}.sub{letter-spacing:2px}
.who{display:none}.card{padding:16px}
.grid,.docs{grid-template-columns:1fr}
.ph{flex-direction:column;text-align:center}.badges{justify-content:center}
.fbox{padding:20px 16px}.mbox{padding:16px}
.btn{width:100%}.btn.sm,td .btn,.cta .btn{width:auto}.cta .btn{flex:1}
}
.badges.c{justify-content:center}
.mt{margin-top:14px}
.lnk{color:var(--acc);text-decoration:underline}

.rules{display:grid;gap:14px;max-width:820px;margin:0 auto}
.rule{display:flex;gap:18px;align-items:flex-start}.rule h3{margin:0 0 4px}.rn{font:900 1.4rem 'Orbitron',sans-serif;color:var(--gold);min-width:38px}
.rb{margin-bottom:14px}.rl{display:flex;justify-content:space-between;gap:10px;text-transform:uppercase;font-size:.85rem;margin-bottom:5px}
.rbar{height:14px;background:#0a0a0a;border:1px solid #333;border-radius:10px;overflow:hidden}
.rf{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--acc),var(--ok))}.rf.gold{background:linear-gradient(90deg,#b8860b,var(--gold))}.rf.danger{background:linear-gradient(90deg,#800,var(--danger))}
.drow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.15)}
.drow span:first-child{color:var(--sec);text-transform:uppercase;font-size:.85rem;flex-shrink:0}.drow span:last-child{text-align:right;overflow-wrap:anywhere}
.srow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.srow.c{justify-content:center}
.qrw{display:flex;justify-content:center;margin:14px 0 8px}.qrw canvas{background:#fff;width:280px;max-width:100%;height:auto;image-rendering:pixelated}
.warn{color:var(--gold);font-size:.85rem;margin-bottom:14px}
canvas{max-width:100%}.card,.fbox,.prof,.mbox{overflow-wrap:anywhere}
@media(max-width:420px){.auth .badge{display:none}.logo{font-size:1.2rem}header{gap:8px}.rule{gap:12px}.prof{padding:16px}.drow{flex-direction:column;gap:2px}.drow span:last-child{text-align:left}}
@media(pointer:coarse){.btn.sm,td .btn,.tab,nav a{min-height:44px}.x{width:44px;height:44px}}

</style>

<script>
'use strict';
/* =====================================================================
   MESIN DATA LOKAL — pengganti server.js + SQLite untuk versi satu file.
   Data disimpan permanen di IndexedDB browser (bukan LocalStorage).
   Password di-hash PBKDF2-SHA256 + salt (Web Crypto). Aturan hak akses,
   validasi, keunikan ID, log aktivitas, dan Point sama seperti server asli.
   ===================================================================== */
const Engine = (() => {
  const IDB_NAME = 'nfnc-esports', IDB_STORE = 'kv', KEY = 'db';
  const SESSION_MS = 365 * 864e5;
  let DB = null, persistOk = true;
  const hits = new Map();

  class HttpErr extends Error { constructor(code, msg) { super(msg); this.code = code; } }
  const fail = (c, m) => { throw new HttpErr(c, m); };

  /* ---------- penyimpanan IndexedDB ---------- */
  const idbOpen = () => new Promise((ok, no) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
  const idbGet = async () => { const d = await idbOpen(); return new Promise((ok, no) => { const q = d.transaction(IDB_STORE).objectStore(IDB_STORE).get(KEY); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }); };
  const idbPut = async v => { const d = await idbOpen(); return new Promise((ok, no) => { const t = d.transaction(IDB_STORE, 'readwrite'); t.objectStore(IDB_STORE).put(v, KEY); t.oncomplete = () => ok(); t.onerror = () => no(t.error); }); };
  let saveQ = Promise.resolve();
  const save = () => { if (!persistOk) return saveQ; const snap = JSON.parse(JSON.stringify(DB)); saveQ = saveQ.then(() => idbPut(snap)).catch(() => { persistOk = false; window.dispatchEvent(new Event('nfnc-nopersist')); }); return saveQ; };

  /* ---------- util ---------- */
  const today = () => new Date().toISOString().slice(0, 10), nowIso = () => new Date().toISOString();
  const nid = t => (DB.seq[t] = (DB.seq[t] || 0) + 1);
  const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
  const unhex = s => new Uint8Array((s.match(/../g) || []).map(h => parseInt(h, 16)));
  const pbk = async (pw, salt) => new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']), 256));
  const hash = async pw => { const s = crypto.getRandomValues(new Uint8Array(16)); return `pbkdf2$${hex(s)}$${hex(await pbk(pw, s))}`; };
  const verify = async (pw, h) => { const [a, s, x] = String(h).split('$'); if (a !== 'pbkdf2' || !s || !x) return false; const y = hex(await pbk(pw, unhex(s))); let d = y.length ^ x.length; for (let i = 0; i < y.length; i++) d |= y.charCodeAt(i) ^ (x.charCodeAt(i) || 0); return d === 0; };
  const rl = (key, max, win, add) => { const n = Date.now(), a = (hits.get(key) || []).filter(t => n - t < win); if (add) a.push(n); hits.set(key, a); return a.length > max; };

  /* ---------- data awal ---------- */
  const SETTING_DEFAULTS = { tagline: 'Never Forget Never Compromise', about: 'NFNC adalah komunitas gaming dengan sistem keanggotaan digital resmi.', foundedYear: '2022', announcement: '', shopeeUrl: '', tokopediaUrl: '', shareUrl: '' };

    if (p === '/admin/data' && method === 'GET') return clone({ members: [...DB.members].sort((a, b) => a.memberId.localeCompare(b.memberId)).map(m => ({ ...pubM(m), wa: (m.profile || {}).wa || '' })), jabatan: DB.jabatan, recruits: [...DB.recruits].sort((a, b) => b.id - a.id).map(x => { const { pass, ...rest } = x; return rest; }),
      orgRecords: [...DB.orgRecords].sort(dd), memberRecords: [...DB.memberRecords].sort(dd), apparel: DB.apparel, docs: [...DB.docs].sort(dd), rules: [...DB.rules].sort((a, b) => a.id - b.id), settings: getSettings(), lastBackup: DB.lastBackup || null,
      points: [...DB.points].sort((a, b) => b.id - a.id).slice(0, 300).map(ptsOut), log: [...DB.log].sort((a, b) => b.id - a.id).slice(0, 200) });
    if (p === '/admin/settings' && method === 'PUT') {
      const c = clean(SP.settings, b, true); if (c.err) fail(400, c.err);
      for (const [k, v] of Object.entries(c.v)) DB.settings[k] = String(v);
      audit(me, 'ubah pengaturan home', Object.keys(c.v).join(',')); return done({ ok: 1 });
    }
    if (p === '/admin/backup' && method === 'GET') { DB.lastBackup = nowIso(); await save(); return clone(DB); }
    if (p === '/admin/export' && method === 'GET') return clone(DB.members.map(m => { const pr = m.profile || {}; return { email: m.email, name: m.name, memberId: m.memberId, jabatan: m.jabatan, role: m.role, status: m.status, joinedAt: m.joinedAt, points: m.points, nick: pr.nick || '', nama: pr.nama || '', umur: pr.umur || '', wa: pr.wa || '', alamat: pr.alamat || '', bio: pr.bio || '', rating: (m.ratings || []).join('/') }; }));
    if (p === '/admin/restore' && method === 'POST') {
      const d = b.data;
      const okShape = d && d.v === 1 && d.seq && d.settings && ['jabatan', 'members', 'recruits', 'orgRecords', 'memberRecords', 'apparel', 'docs', 'points', 'log'].every(k => Array.isArray(d[k]));
      if (!okShape) fail(400, 'File cadangan tidak valid');
      if (!d.members.some(m => m.role === 'admin' && m.status === 'aktif')) fail(400, 'Cadangan harus memuat minimal satu admin aktif');
      const keep = me.email; d.session = null; DB = clone(d); norm();
      const nm = DB.members.find(m => ieq(m.email, keep) && m.role === 'admin' && m.status === 'aktif'); if (nm) startSession(nm);
      audit(nm || { email: keep }, 'pulihkan cadangan data', ''); return done({ ok: 1 });
    }
    if ((r = p.match(/^\/admin\/members\/(\d+)\/ratings$/)) && method === 'PUT') {
      const t = byId('members', r[1]); if (!t) fail(404, 'Anggota tidak ditemukan');
      const a = Array.isArray(b.ratings) ? b.ratings.map(x => parseInt(x, 10)) : [];
      if (a.length !== 5 || a.some(x => isNaN(x) || x < 0 || x > 100)) fail(400, 'Rating harus 5 angka antara 0 dan 100');
      t.ratings = a; audit(me, 'ubah rating', t.memberId); return done({ ok: 1 });
    }
    if ((r = p.match(/^\/admin\/members\/(\d+)\/points$/)) && method === 'POST') {
      const t = byId('members', r[1]); if (!t) fail(404, 'Anggota tidak ditemukan');
      const d = parseInt(b.delta, 10), reason = String(b.reason || '').trim().slice(0, 100);
      if (!d || Math.abs(d) > 100000) fail(400, 'Jumlah point tidak valid');
      t.points = Math.max(0, t.points + d);
      DB.points.push({ id: nid('points'), memberRef: t.id, delta: d, balance: t.points, reason, by: me.email, at: nowIso() });
      audit(me, 'ubah point', `${t.memberId} ${d > 0 ? '+' : ''}${d} (${reason})`);
      return done({ member: pubM(t) });
    }
    if ((r = p.match(/^\/admin\/recruits\/(\d+)(\/accept)?$/))) {
      const rc = byId('recruits', r[1]); if (!rc) fail(404, 'Pendaftaran tidak ditemukan');
      if (r[2] && method === 'POST') {
        if (rc.status === 'diterima') fail(400, 'Pendaftaran sudah diterima');
        const own = !String(b.password || '') && !!rc.pass, pw = String(b.password || '') || (own ? 'tidak-dipakai-1' : hex(crypto.getRandomValues(new Uint8Array(5))));
        const mem = { name: rc.name, email: rc.email, memberId: String(b.memberId || '').trim().toUpperCase(), jabatan: String(b.jabatan || rc.jabatan), status: 'aktif', role: 'member', joinedAt: today(), photo: rc.photo || '' };
        if (!/^[A-Z0-9-]{3,20}$/.test(mem.memberId)) fail(400, 'ID anggota tidak valid');
        const e = CHK.members(mem, null, { password: pw }, me); if (e) fail(400, e);
        const m = { id: nid('members'), ...mem, points: 0, profile: rc.wa ? { wa: rc.wa } : {}, ratings: [0, 0, 0, 0, 0], pass: own ? rc.pass : await hash(pw) };
        DB.members.push(m); rc.status = 'diterima'; rc.pass = ''; rc.memberRef = m.id; audit(me, 'terima pendaftaran', `${rc.email} → ${mem.memberId}`);
        await save(); return { member: pubM(m), tempPassword: own ? null : pw, wa: rc.wa || '' };
      }
      if (method === 'PUT') {
        if (!['menunggu', 'diproses', 'ditolak'].includes(b.status)) fail(400, 'Status tidak valid');
        if (rc.status === 'diterima') fail(400, 'Pendaftaran yang sudah diterima tidak dapat diubah');
        rc.status = b.status; audit(me, 'status pendaftaran', `${rc.email} → ${b.status}`); return done({ ok: 1 });
      }
      if (method === 'DELETE') { DB.recruits.splice(DB.recruits.indexOf(rc), 1); audit(me, 'hapus pendaftaran', rc.email); return done({ ok: 1 }); }
    }
    if ((r = p.match(/^\/admin\/(members|jabatan|orgRecords|memberRecords|apparel|docs|rules)(?:\/(\d+))?$/))) {
      const col = r[1], id = r[2] ? +r[2] : null, ex = id ? byId(col, id) : null, label = o => o.name || o.title || o.memberId || '';
      const out = row => col === 'members' ? pubM(row) : row;
      if (method === 'POST' && !id) {
        const c = clean(SP[col], b); if (c.err) fail(400, c.err);
        const o = { ...c.v }, e = (CHK[col] || (() => ''))(o, null, b, me); if (e) fail(400, e);
        const row = { id: nid(col), ...o };
        if (col === 'members') { row.pass = await hash(String(b.password)); row.points = 0; row.profile = {}; row.ratings = [0, 0, 0, 0, 0]; row.joinedAt = o.joinedAt || today(); }
        DB[col].push(row); audit(me, 'tambah ' + col, label(o)); return done({ item: out(row) });
      }
      if (method === 'PUT' && id) {
        if (!ex) fail(404, 'Data tidak ditemukan');
        const c = clean(SP[col], b, true); if (c.err) fail(400, c.err);
        const o = { ...ex, ...c.v }, e = (CHK[col] || (() => ''))(o, ex, b, me); if (e) fail(400, e);
        const upd = { ...c.v }; if (col === 'members' && b.password) upd.pass = await hash(String(b.password));
        if (col === 'jabatan' && upd.name && upd.name !== ex.name) { const old = ex.name; DB.members.forEach(m => { if (m.jabatan === old) m.jabatan = upd.name; }); DB.recruits.forEach(x => { if (x.jabatan === old) x.jabatan = upd.name; }); }
        Object.assign(ex, upd);
        if (col === 'members' && (b.password || ex.status !== 'aktif') && DB.session && DB.session.memberId === id) DB.session = null;
        audit(me, 'ubah ' + col, label(ex)); return done({ item: out(ex) });
      }
      if (method === 'DELETE' && id) {
        if (!ex) fail(404, 'Data tidak ditemukan');
        if (col === 'members') {
          if (ex.id === me.id) fail(400, 'Tidak bisa menghapus akun sendiri');
          if (ex.role === 'admin' && activeAdmins() < 2) fail(400, 'Harus ada minimal satu admin aktif');
        }
        if (col === 'jabatan' && DB.members.some(m => m.jabatan === ex.name)) fail(400, 'Jabatan masih dipakai anggota');
        DB[col].splice(DB[col].indexOf(ex), 1);
        if (col === 'members') { DB.memberRecords = DB.memberRecords.filter(x => x.memberRef !== id); DB.points = DB.points.filter(x => x.memberRef !== id); DB.recruits.forEach(x => { if (x.memberRef === id) x.memberRef = null; }); }
        audit(me, 'hapus ' + col, label(ex)); return done({ ok: 1 });
      }
    }
    fail(404, 'Endpoint tidak ditemukan');
  }
  return { init, call, hash, persisted: () => persistOk, storage: async () => { let p = false, e = {}; try { p = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); e = (navigator.storage && navigator.storage.estimate && await navigator.storage.estimate()) || {}; } catch (x) {} return { persisted: p, usage: e.usage || 0, quota: e.quota || 0 }; } };
})();

<script>

async function uploadFile(el) {
  const f = el.files[0]; if (!f) return;
  const vid = f.type.startsWith('video/'), lim = el.dataset.up === 'recruit' ? 2e6 : vid ? 30e6 : 5e6;
  if (!/^(image\/(png|jpeg|webp|gif)|video\/(mp4|webm))$/.test(f.type)) { el.value = ''; return toast('Tipe file tidak didukung', 1); }
  if (f.size > lim) { el.value = ''; return toast('File terlalu besar (maks. ' + lim / 1e6 + ' MB)', 1); }
  const box = el.closest('.up'); box.classList.add('busy');
  try {
    const du = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(new Error('Gagal membaca file')); r.readAsDataURL(f); });
    const d = await api('/upload?scope=' + el.dataset.up, 'POST', { dataUrl: du });
    box.querySelector('input[type=hidden]').value = d.url; box.querySelector('.prev').innerHTML = prev(d.url);
  } catch (e) { toast(e.message, 1); }
  box.classList.remove('busy'); el.value = '';
}

    var nb = BLK[e][v], eccLen = ECC[e][v], raw = Math.floor(rawMods(v)/8);

          case 2: inv=xx%3===0; break;
          case 3: inv=(xx+yy)%3===0; break;
          case 4: inv=(Math.floor(xx/3)+Math.floor(yy/2))%2===0; break;
          case 5: inv=xx*yy%2+xx*yy%3===0; break;
          case 6: inv=(xx*yy%2+xx*yy%3)%2===0; break;
          default: inv=((xx+yy)%2+xx*yy%3)%2===0;
        }
        if(!fn[yy][xx] && inv) m[yy][xx]=!m[yy][xx];
      }
    }
    function penalty(){
      var p=0, a, b, run, dark=0;
      for(a=0;a<size;a++){
        for(var dir=0;dir<2;dir++){
          run=1;
          for(b=1;b<size;b++){
            var c1 = dir? m[b][a]:m[a][b], c0 = dir? m[b-1][a]:m[a][b-1];

          }
        }
      }
      for(a=0;a<size-1;a++) for(b=0;b<size-1;b++){ var c=m[a][b]; if(c===m[a][b+1]&&c===m[a+1][b]&&c===m[a+1][b+1]) p+=3; }

    }

    mask(best); fmtBits(best);
    return {size:size, modules:m};
  }
  return {make:make};
})();

  run(FORMS[f.dataset.form])(f).finally(() => { if (b) b.disabled = false; });
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.chg && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); if (t.dataset.up) run(uploadFile)(t); if (t.dataset.bk) run(restoreFile)(t); });
async function restoreFile(el) {
  const f = el.files[0]; if (!f) return; el.value = '';
  let d; try { d = JSON.parse(await f.text()); } catch (e) { throw new Error('File bukan JSON yang valid'); }
  if (!confirm('Timpa SEMUA data saat ini dengan isi file cadangan "' + f.name + '"?')) return;
  await api('/admin/restore', 'POST', { data: d }); await refreshAdmin(); toast('Data berhasil dipulihkan');
}
document.addEventListener('input', e => { const t = e.target; if (t.dataset.inp && INP[t.dataset.inp]) INP[t.dataset.inp](t.value); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
let RT = 0;
async function route() {
  const my = ++RT;
  try {
    const h = location.hash.replace(/^#\/?/, '').split('?')[0] || 'home';
    const pg = PAGES[h] ? h : 'home';
    PD = await api('/public'); ME = (await api('/me')).user;
    if (my !== RT) return;
    PAGE = pg; NEED = NEEDS[pg] || '';
    if (NEED && !ME) { go('login', 'next=' + pg); return; }
    if (NEED === 'admin' && ME.role !== 'admin') { toast('⛔ Akses ditolak. Menu ini hanya untuk Admin.', 1); go('home'); return; }
    if (pg === 'login' && ME) { go(ME.role === 'admin' ? 'admin' : 'profile'); return; }
    document.title = TITLES[pg] + ' — NFNC Esports';
    renderNav(); $('#nav').classList.remove('open');
    const html = await PAGES[pg]();
    if (my !== RT) return;
    $('#view').innerHTML = html; window.scrollTo(0, 0);
  } catch (e) { $('#view').innerHTML = `<p class="err">Gagal memuat data: ${esc(e.message)}</p>`; }
}
window.addEventListener('hashchange', route);
window.addEventListener('nfnc-nopersist', () => toast('⚠ Penyimpanan browser tidak tersedia — data hilang saat halaman ditutup.', 1));
Engine.init().then(route);

</script>
<script>
/* ===== Pendaftaran langsung aktif + anggota online (Firebase Firestore REST) ===== */
const FB = { projectId: '', apiKey: '', adminEmail: '' }; /* ISI dari Firebase Console */
const FB_ON = () => !!(FB.projectId && FB.apiKey && FB.adminEmail);
const fsDocs = () => `projects/${FB.projectId}/databases/(default)/documents`;
const fsUrl = () => `https://firestore.googleapis.com/v1/${fsDocs()}`;
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
const toF = o => { const f = {}; for (const k in o) f[k] = { stringValue: String(o[k] == null ? '' : o[k]) }; return f; };
const fromF = d => { const o = {}; for (const k in (d.fields || {})) o[k] = d.fields[k].stringValue || ''; return o; };
async function fbReq(url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((j.error && j.error.message) || 'Gagal terhubung ke Firebase'); e.status = r.status; throw e; }
  return j;
}
let FB_TOKEN = '', FB_EXP = 0;
async function fbAuth() {
  if (!FB_TOKEN || Date.now() > FB_EXP) {
    const pw = prompt('Password akun Admin Firebase (' + FB.adminEmail + '):'); if (!pw) throw new Error('Login Firebase dibatalkan');
    const j = await fbReq(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB.apiKey}`, { method: 'POST', body: JSON.stringify({ email: FB.adminEmail, password: pw, returnSecureToken: true }) });
    FB_TOKEN = j.idToken; FB_EXP = Date.now() + 50 * 60000;
  }
  return { Authorization: 'Bearer ' + FB_TOKEN };
}
const enter = () => go(ME.role === 'admin' ? 'admin' : 'profile');
const _login = FORMS.login;
FORMS.login = async f => {
  if (!FB_ON()) return _login(f);
  const o = formObj(f), email = String(o.email || '').trim().toLowerCase(); let rec = null;
  try { rec = fromF(await fbReq(`${fsUrl()}/members/${await sha(email)}`)); } catch (e) { /* 404 / offline: coba login lokal */ }
  if (!rec) return _login(f);
  ME = (await api('/online/login', 'POST', { rec, password: o.password })).user; toast('Selamat datang, ' + ME.name); enter();
};
FORMS.recruit = async f => {
  const o = formObj(f), email = String(o.email || '').trim().toLowerCase();
  if (String(o.password).length < 8) throw new Error('Password minimal 8 karakter');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) throw new Error('Email tidak valid');
  if (!/^[0-9+\-\s]{8,20}$/.test(o.wa || '')) throw new Error('No. WhatsApp tidak valid');
  if (!String(o.name || '').trim()) throw new Error('Nama wajib diisi');
  if (!FB_ON()) { ME = (await api('/register-local', 'POST', { name: o.name, email, wa: o.wa, password: o.password })).user; toast('✅ Pendaftaran berhasil! ID Anda: ' + ME.memberId); return enter(); }
  const id = await sha(email), pass = await Engine.hash(o.password);
  let rec = null;
  for (let t = 0; t < 6 && !rec; t++) {
    const mid = 'NFNC-' + (1000 + Math.floor(Math.random() * 9000)), r = { name: o.name.trim().slice(0, 60), email, wa: o.wa, jabatan: 'Member', memberId: mid, role: 'member', status: 'aktif', points: '0', joinedAt: new Date().toISOString().slice(0, 10), pass };
    try {
      await fbReq(`${fsUrl()}:commit`, { method: 'POST', body: JSON.stringify({ writes: [
        { update: { name: `${fsDocs()}/members/${id}`, fields: toF(r) }, currentDocument: { exists: false } },
        { update: { name: `${fsDocs()}/ids/${mid}`, fields: toF({ email }) }, currentDocument: { exists: false } }] }) });
      rec = r;
    } catch (e) {
      if (e.status === 409 || /ALREADY_EXISTS/.test(e.message)) { if (/\/members\//.test(e.message)) throw new Error('Email ini sudah terdaftar. Silakan login.'); continue; }
      throw e;
    }
  }
  if (!rec) throw new Error('Gagal membuat ID anggota, coba lagi.');
  ME = (await api('/online/login', 'POST', { rec, password: o.password })).user;
  toast('✅ Pendaftaran berhasil! ID Anda: ' + rec.memberId); enter();
};
async function pushM(m, pw) {
  if (!FB_ON() || !m) return;
  try {
    const h = await fbAuth(), fl = { name: m.name, jabatan: m.jabatan, status: m.status, role: m.role, memberId: m.memberId, points: m.points };
    if (pw) fl.pass = await Engine.hash(pw);
    const mask = Object.keys(fl).map(k => 'updateMask.fieldPaths=' + k).join('&');
    await fbReq(`${fsUrl()}/members/${await sha(String(m.email).toLowerCase())}?${mask}&currentDocument.exists=true`, { method: 'PATCH', headers: h, body: JSON.stringify({ fields: toF(fl) }) });
  } catch (e) { if (e.status !== 404) toast('⚠ Perubahan belum tersimpan online: ' + e.message); }
}
const _fm = FORMS.member, _fp = FORMS.points, _md = ACT['m-del'];
FORMS.member = async f => { const id = f.dataset.id, pw = f.password && f.password.value; await _fm(f); if (id) await pushM(AD.members.find(x => x.id === +id), pw); };
FORMS.points = async f => { const id = f.dataset.id; await _fp(f); await pushM(AD.members.find(x => x.id === +id)); };
ACT['m-del'] = async el => {
  const m = AD.members.find(x => x.id === +el.dataset.id); await _md(el);
  if (FB_ON() && m && !AD.members.some(x => x.id === m.id)) { try { await fbReq(`${fsUrl()}/members/${await sha(String(m.email).toLowerCase())}`, { method: 'DELETE', headers: await fbAuth() }); } catch (e) { toast('⚠ Gagal hapus online: ' + e.message); } }
};
ACT['m-sync'] = async () => {
  if (!FB_ON()) throw new Error('Firebase belum diisi di file (bagian const FB).');
  const h = await fbAuth(); let items = [], tok = '';
  do { const j = await fbReq(`${fsUrl()}/members?pageSize=100${tok ? '&pageToken=' + tok : ''}`, { headers: h }); items.push(...(j.documents || []).map(fromF)); tok = j.nextPageToken || ''; } while (tok);
  const r = await api('/admin/members/import', 'POST', { items }); await refreshAdmin(); toast(r.added + ' anggota baru diambil dari online');
};
const _am = ATABS.members;
ATABS.members = () => _am().replace('<button class="btn" data-act="m-add">', '<button class="btn" data-act="m-sync">⟳ AMBIL ANGGOTA ONLINE</button><button class="btn" data-act="m-add">');
ATABS.recruits = () => `<div class="fbox"><h3>Pesan untuk Anggota</h3><label class="fl">Isi pesan (dipakai tombol WA dan Email)</label><textarea id="rmsg" rows="3" placeholder="Halo, ..."></textarea><div class="acts"><button class="btn" data-act="m-sync">⟳ AMBIL PENDAFTAR ONLINE</button><button class="btn okb" data-act="rc-mailall">✉ Email Semua Anggota Aktif</button></div></div>` +
  tbl(['Daftar', 'Nama', 'Email', 'WA', 'ID', 'Jabatan', 'Akses', 'Status', 'Aksi'], AD.members.map(m => `<tr><td>${dt(m.joinedAt)}</td><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${esc(m.wa || '—')}</td><td>${esc(m.memberId)}</td><td>${esc(m.jabatan)}</td><td><span class="badge ${m.role === 'admin' ? 'adm' : 'mem'}">${m.role === 'admin' ? 'ADMIN' : 'MEMBER'}</span></td><td><span class="badge ${m.status === 'aktif' ? 'ok' : 'off'}">${m.status}</span></td><td class="acts"><button class="btn sm" data-act="rc-access" data-id="${m.id}">Jabatan &amp; Akses</button>${m.wa ? `<button class="btn sm okb" data-act="rc-wa" data-id="${m.id}">WA</button>` : ''}<button class="btn sm ghost" data-act="rc-mail" data-id="${m.id}">Email</button></td></tr>`));
const rcMsg = () => (($('#rmsg') || {}).value || '').trim();
const rcSubj = 'Info dari NFNC Esports';
ACT['rc-access'] = el => { const m = byId(AD.members, el.dataset.id); modal('JABATAN & AKSES — ' + m.name, `<form data-form="access" data-id="${m.id}">${fh({ k: 'jabatan', l: 'Jabatan', t: 'select', o: AD.jabatan.map(j => j.name) }, m.jabatan)}${fh({ k: 'role', l: 'Akses (Admin = akses penuh Admin Panel)', t: 'select', o: ['member', 'admin'] }, m.role)}${fh({ k: 'status', l: 'Status akun', t: 'select', o: ['aktif', 'nonaktif'] }, m.status)}<button class="btn full">SIMPAN</button></form>`); };
FORMS.access = async f => {
  const id = +f.dataset.id, m = byId(AD.members, id), o = formObj(f);
  await api('/admin/members/' + id, 'PUT', { name: m.name, email: m.email, memberId: m.memberId, joinedAt: m.joinedAt, photo: m.photo || '', jabatan: o.jabatan, role: o.role, status: o.status });
  await afterSave('Jabatan & akses diperbarui'); await pushM(AD.members.find(x => x.id === id));
};
ACT['rc-wa'] = el => { const m = byId(AD.members, el.dataset.id); window.open(waLink(m.wa, rcMsg() || 'Halo ' + m.name + ', ini Admin NFNC.'), '_blank', 'noopener'); };
ACT['rc-mail'] = el => { const m = byId(AD.members, el.dataset.id); location.href = 'mailto:' + m.email + '?subject=' + encodeURIComponent(rcSubj) + '&body=' + encodeURIComponent(rcMsg() || 'Halo ' + m.name + ','); };
ACT['rc-mailall'] = () => { const to = AD.members.filter(m => m.status === 'aktif').map(m => m.email); if (!to.length) throw new Error('Belum ada anggota aktif'); location.href = 'mailto:?bcc=' + encodeURIComponent(to.join(',')) + '&subject=' + encodeURIComponent(rcSubj) + '&body=' + encodeURIComponent(rcMsg()); };
const _pr = PAGES.recruit, _pl = PAGES.login;
PAGES.recruit = async () => head('JOIN NFNC', 'Daftar Akun Anggota') + `<form class="fbox" data-form="recruit">${fh({ k: 'name', l: 'Nama', req: 1 })}${fh({ k: 'email', t: 'email', l: 'Email', req: 1, ph: 'nama@email.com' })}${fh({ k: 'wa', l: 'No. WhatsApp', t: 'tel', req: 1, ph: '08xxxxxxxxxx' })}${fh({ k: 'password', l: 'Password (min. 8 karakter)', t: 'password', req: 1 })}<button class="btn full">DAFTAR &amp; LANGSUNG MASUK</button></form>`;
PAGES.login = async () => {
  if (FB_ON() && !location.hash.includes('setup=1') && (await api('/setup')).needed)
    return head('LOGIN ANGGOTA', 'Masuk ke Akun NFNC') + `<form class="fbox" data-form="login">${fh({ k: 'email', t: 'email', l: 'Email', req: 1 })}${fh({ k: 'password', l: 'Password', t: 'password', req: 1 })}<button class="btn full">LOGIN</button><p class="muted center mt">Belum punya akun? <a class="lnk" href="#/recruit">Daftar di sini</a>. Akun langsung aktif.</p><p class="muted center"><a class="lnk" href="#/login?setup=1">Setup awal (khusus pemilik web)</a></p></form>`;
  return (await _pl()).replace('Akun dibuat oleh Admin setelah pendaftaran diterima.', 'Akun langsung aktif setelah mendaftar.');
};
</script>
